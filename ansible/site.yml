# Deploys vpn_balancer (rootless Podman) on a self-hosted Linux machine.
#   ansible-playbook site.yml -K --ask-vault-pass
- name: Deploy vpn_balancer
  hosts: vpn
  # Facts are gathered as the connecting user: the stack runs rootless under this user,
  # only the host preparation below uses sudo.
  vars:
    vpn_src_dir: "{{ playbook_dir }}/.."
    vpn_runtime_files:
      - Containerfile
      - compose.yml
      - Makefile
      - entrypoint.sh
      - watchdog.sh
      - gen-conf.sh
      - tls-verify.sh
      - gw.sh
      - pia-servers.py
      - haproxy/haproxy.cfg
    # Changes here restart only the monitoring containers, not the tunnels.
    # monitoring/alertmanager.yml is not copied: it is rendered from templates/alertmanager.yml.j2.
    vpn_monitoring_files:
      - monitoring/prometheus.yml
      - monitoring/rules.yml
      - monitoring/grafana/provisioning/datasources/prometheus.yml
      - monitoring/grafana/provisioning/dashboards/vpn.yml
      - monitoring/grafana/dashboards/vpn.json
    vpn_monitoring_dirs:
      - monitoring/grafana/provisioning/datasources
      - monitoring/grafana/provisioning/dashboards
      - monitoring/grafana/dashboards
    vpn_monitoring_ports: ["{{ grafana_port }}", "{{ prometheus_port }}", "{{ alertmanager_port }}"]
    # Ports opened in the active firewall (firewalld or ufw), as port/proto
    vpn_firewall_ports: >-
      {{ (['%s/tcp' % lb_socks_port, '%s/tcp' % lb_http_port, '%s/udp' % wg_port] if vpn_open_firewall | bool else [])
      + (vpn_monitoring_ports | map('regex_replace', '$', '/tcp') | list
         if vpn_monitoring | bool and monitoring_bind != '127.0.0.1' else []) }}
    vpn_packages:
      RedHat: [podman, podman-compose, python3, make, curl, openssl, unzip]
      # uidmap: newuidmap for rootless; netavark + aardvark-dns: container names (vpn1, haproxy...) resolve
      # inside the compose network; dbus-user-session: podman build creates cgroups through the user's D-Bus;
      # fuse-overlayfs: overlay storage where the kernel can't do it rootless natively
      Debian: [podman, podman-compose, python3, make, curl, openssl, unzip, uidmap, slirp4netns, passt,
               netavark, aardvark-dns, dbus-user-session, fuse-overlayfs]
    vpn_containers: "{{ ['vpn1', 'vpn2', 'vpn-lb', 'vpn-gw']
      + (['vpn-prometheus', 'vpn-alertmanager', 'vpn-grafana'] if vpn_monitoring | bool else []) }}"
    vpn_telegram: "{{ telegram_chat_id | string | length > 0 and telegram_bot_token | length > 0 }}"
    vpn_xdg_env:
      XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"

  tasks:
    - name: Host preparation (root)
      become: true
      block:
        # Older Debian/Ubuntu ship Podman without netavark/aardvark-dns: HAProxy could not resolve vpn1/vpn2
        - name: Check the OS
          ansible.builtin.assert:
            that: >-
              ansible_facts.os_family == 'RedHat'
              or (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version | int >= 12)
              or (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_major_version | int >= 24)
            fail_msg: >-
              {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} is not supported:
              use Fedora/RHEL, Debian 12+ or Ubuntu 24.04+.

        - name: Install packages (Fedora/RHEL)
          ansible.builtin.package:
            name: "{{ vpn_packages.RedHat }}"
            state: present
          when: ansible_facts.os_family == 'RedHat'

        - name: Install packages (Debian/Ubuntu)
          ansible.builtin.apt:
            name: "{{ vpn_packages.Debian }}"
            state: present
            update_cache: true
            cache_valid_time: 3600
          when: ansible_facts.os_family == 'Debian'

        - name: Look for the user's subordinate ids
          ansible.builtin.shell: grep -q '^{{ ansible_facts.user_id }}:' /etc/subuid && grep -q '^{{ ansible_facts.user_id }}:' /etc/subgid
          register: vpn_subids
          changed_when: false
          failed_when: vpn_subids.rc > 1
          check_mode: false

        # Rootless Podman maps the container's users onto them; users created before uidmap was installed have none
        - name: Give the user subordinate ids
          ansible.builtin.command: >-
            usermod --add-subuids {{ vpn_subid_start }}-{{ vpn_subid_start | int + 65535 }}
            --add-subgids {{ vpn_subid_start }}-{{ vpn_subid_start | int + 65535 }} {{ ansible_facts.user_id }}
          vars:
            vpn_subid_start: "{{ 100000 + (ansible_facts.user_uid | int - 1000) * 65536 }}"
          when: vpn_subids.rc != 0

        - name: Load the tun module now and on boot
          community.general.modprobe:
            name: tun
            state: present
            persistent: present

        - name: Allow containers to use /dev/net/tun (SELinux)
          ansible.posix.seboolean:
            name: container_use_devices
            state: true
            persistent: true
          when: ansible_facts.selinux.status == 'enabled'

        - name: Keep user services running without a login session (rootless containers survive logout/reboot)
          ansible.builtin.command: loginctl enable-linger {{ ansible_facts.user_id }}
          args:
            creates: /var/lib/systemd/linger/{{ ansible_facts.user_id }}

        - name: Find the active firewall
          ansible.builtin.shell: |
            if systemctl is-active -q firewalld; then echo firewalld
            elif command -v ufw >/dev/null && ufw status | grep -q '^Status: active'; then echo ufw
            fi
          register: vpn_firewall
          changed_when: false
          check_mode: false
          when: vpn_firewall_ports | length > 0

        # Proxy + WireGuard ports when published on the LAN, monitoring UIs when not bound to 127.0.0.1
        - name: Open ports on the LAN (firewalld)
          ansible.posix.firewalld:
            port: "{{ item }}"
            permanent: true
            immediate: true
            state: enabled
          loop: "{{ vpn_firewall_ports }}"
          when: vpn_firewall_ports | length > 0 and vpn_firewall.stdout == 'firewalld'

        - name: Open ports on the LAN (ufw)
          community.general.ufw:
            rule: allow
            port: "{{ item.split('/')[0] }}"
            proto: "{{ item.split('/')[1] }}"
          loop: "{{ vpn_firewall_ports }}"
          when: vpn_firewall_ports | length > 0 and vpn_firewall.stdout == 'ufw'

    # Debian 12 ships no storage.conf and Podman then defaults to vfs (a full copy of every layer, fills the disk).
    # Only before Podman's first use: switching the driver of existing storage breaks its images.
    - name: Look for existing Podman storage
      ansible.builtin.stat:
        path: "{{ ansible_facts.user_dir }}/.local/share/containers/storage"
      register: vpn_storage
      when: ansible_facts.os_family == 'Debian'

    - name: Use the overlay storage driver
      when: ansible_facts.os_family == 'Debian' and not vpn_storage.stat.exists
      block:
        - name: Create the Podman config directory
          ansible.builtin.file:
            path: "{{ ansible_facts.user_dir }}/.config/containers"
            state: directory
            mode: "0755"

        - name: Write storage.conf
          ansible.builtin.copy:
            content: "[storage]\ndriver = \"overlay\"\n"
            dest: "{{ ansible_facts.user_dir }}/.config/containers/storage.conf"
            mode: "0644"
            force: false

    # dbus-user-session installed above only takes effect at the next login otherwise
    - name: Start the user's D-Bus
      ansible.builtin.systemd_service:
        name: dbus.socket
        scope: user
        state: started
      environment: "{{ vpn_xdg_env }}"
      when: ansible_facts.os_family == 'Debian'

    - name: Check that the PIA client is installed (servers.txt and the CA certificate come from it)
      ansible.builtin.stat:
        path: /opt/piavpn/etc/data.json
      register: vpn_pia_data

    - name: Fail without the PIA client
      ansible.builtin.assert:
        that: vpn_pia_data.stat.exists
        fail_msg: Install the PIA client (/opt/piavpn) on {{ inventory_hostname }} first; it may stay disconnected.

    - name: Fail without a Grafana password
      ansible.builtin.assert:
        that: vault_grafana_admin_password is defined
        fail_msg: Add vault_grafana_admin_password to group_vars/vpn/vault.yml (ansible-vault edit), or set vpn_monitoring false.
      when: vpn_monitoring | bool

    - name: Find a running stack
      ansible.builtin.command: >-
        podman ps --filter name=^vpn-lb$
        --format '{{ "{{" }} index .Labels "com.docker.compose.project.working_dir" {{ "}}" }}'
      register: vpn_running
      changed_when: false
      check_mode: false  # read-only; the guard below must work in --check too

    - name: Refuse to start a second stack next to one run from another directory
      ansible.builtin.assert:
        that: vpn_running.stdout in ['', vpn_deploy_dir]
        fail_msg: >-
          The stack is already running from {{ vpn_running.stdout }}.
          Stop it there first (make down), then re-run the playbook.

    - name: Create directories
      ansible.builtin.file:
        path: "{{ vpn_deploy_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ ['', 'haproxy'] + (vpn_monitoring_dirs if vpn_monitoring | bool else []) }}"

    - name: Create the secrets directory
      ansible.builtin.file:
        path: "{{ vpn_deploy_dir }}/secrets"
        state: directory
        mode: "0700"

    - name: Copy runtime files
      ansible.builtin.copy:
        src: "{{ vpn_src_dir }}/{{ item }}"
        dest: "{{ vpn_deploy_dir }}/{{ item }}"
        mode: preserve
      loop: "{{ vpn_runtime_files + (['compose.monitoring.yml'] if vpn_monitoring | bool else []) }}"
      notify: Restart stack

    - name: Write credentials
      ansible.builtin.copy:
        content: "{{ item.user }}\n{{ item.password }}\n"
        dest: "{{ vpn_deploy_dir }}/secrets/{{ item.file }}"
        mode: "0600"
      loop:
        - { file: pia-auth.txt, user: "{{ pia_user }}", password: "{{ pia_password }}" }
        - { file: socks-auth.txt, user: "{{ socks_user }}", password: "{{ socks_password }}" }
      loop_control:
        label: "{{ item.file }}"
      no_log: true
      notify: Restart stack

    # WireGuard keys from this repo (secrets/wg), if any: existing client configs keep working.
    # Without them the gateway generates new keys on first start (make wg-peer N=1 on the target).
    - name: Create the WireGuard keys directory
      ansible.builtin.file:
        path: "{{ vpn_deploy_dir }}/secrets/wg"
        state: directory
        mode: "0700"

    - name: Copy WireGuard keys
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ vpn_deploy_dir }}/secrets/wg/"
        mode: "0600"
      with_fileglob: ["{{ vpn_src_dir }}/secrets/wg/*"]
      no_log: true
      notify: Restart stack

    - name: Write .env
      ansible.builtin.template:
        src: env.j2
        dest: "{{ vpn_deploy_dir }}/.env"
        mode: "0644"
      notify: Restart stack

    - name: Monitoring
      when: vpn_monitoring | bool
      block:
        - name: Copy monitoring configs
          ansible.builtin.copy:
            src: "{{ vpn_src_dir }}/{{ item }}"
            dest: "{{ vpn_deploy_dir }}/{{ item }}"
            mode: "0644"
          loop: "{{ vpn_monitoring_files }}"
          notify: Restart monitoring

        - name: Write Alertmanager config
          ansible.builtin.template:
            src: alertmanager.yml.j2
            dest: "{{ vpn_deploy_dir }}/monitoring/alertmanager.yml"
            mode: "0644"
          notify: Restart monitoring

        # 644 inside the 700 secrets/ dir: Grafana (uid 472) and Alertmanager (nobody) read them in the container
        - name: Write monitoring secrets
          ansible.builtin.copy:
            content: "{{ item.content }}"
            dest: "{{ vpn_deploy_dir }}/secrets/{{ item.file }}"
            mode: "0644"
          loop:
            - { file: grafana-admin.txt, content: "{{ grafana_admin_password }}" }
            - { file: telegram-bot-token.txt, content: "{{ telegram_bot_token }}" }
          loop_control:
            label: "{{ item.file }}"
          no_log: true
          notify: Restart monitoring

    # Rewritten in place every run; the tunnels read it on (re)connect, no restart needed
    - name: Refresh servers.txt from the PIA client's cache
      ansible.builtin.command: python3 pia-servers.py
      args:
        chdir: "{{ vpn_deploy_dir }}"
      changed_when: false

    - name: Fetch PIA's CA certificate
      ansible.builtin.command: make ovpn/ca.crt
      args:
        chdir: "{{ vpn_deploy_dir }}"
        creates: "{{ vpn_deploy_dir }}/ovpn/ca.crt"

    - name: Start the stack
      ansible.builtin.command: make up
      args:
        chdir: "{{ vpn_deploy_dir }}"
      when: vpn_running.stdout == ''
      changed_when: true

    - name: Restart containers after reboot (podman's own unit for restart=always containers)
      ansible.builtin.systemd_service:
        name: podman-restart.service
        scope: user
        enabled: true
      environment: "{{ vpn_xdg_env }}"

    # An old hand-made unit started only vpn1 vpn2 vpn-lb (no vpn-gw, no monitoring); podman-restart covers it all
    - name: Look for the legacy vpn-balancer.service
      ansible.builtin.stat:
        path: "{{ ansible_facts.user_dir }}/.config/systemd/user/vpn-balancer.service"
      register: vpn_legacy_unit

    - name: Remove the legacy vpn-balancer.service
      when: vpn_legacy_unit.stat.exists
      block:
        # Disable only: stopping it would run its ExecStop and take the tunnels down
        - name: Disable the legacy unit
          ansible.builtin.systemd_service:
            name: vpn-balancer.service
            scope: user
            enabled: false
          environment: "{{ vpn_xdg_env }}"

        - name: Delete the legacy unit file
          ansible.builtin.file:
            path: "{{ vpn_legacy_unit.stat.path }}"
            state: absent

        - name: Reload the user's systemd
          ansible.builtin.systemd_service:
            daemon_reload: true
            scope: user
          environment: "{{ vpn_xdg_env }}"

    # Every rebuild of the tunnel image leaves the previous one dangling, together with its build layers.
    # Only dangling images go: tagged ones stay even when unused, they may belong to other projects.
    - name: Create the user's systemd unit directory
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: Write the monthly image cleanup units
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ ansible_facts.user_dir }}/.config/systemd/user/{{ item.name }}"
        mode: "0644"
      loop:
        - name: vpn-image-prune.service
          content: |
            [Unit]
            Description=Remove dangling Podman images left by old builds

            [Service]
            Type=oneshot
            ExecStart=/usr/bin/podman image prune --force
        - name: vpn-image-prune.timer
          content: |
            [Unit]
            Description=Monthly removal of dangling Podman images

            [Timer]
            OnCalendar=monthly
            RandomizedDelaySec=6h
            Persistent=true

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"

    - name: Enable the monthly image cleanup
      ansible.builtin.systemd_service:
        name: vpn-image-prune.timer
        scope: user
        enabled: true
        state: started
        daemon_reload: true
      environment: "{{ vpn_xdg_env }}"

    - name: Apply pending restarts
      ansible.builtin.meta: flush_handlers

    # podman-compose exits 0 even when a container could not be built or created
    - name: List the stack's containers
      ansible.builtin.command: >-
        podman ps --filter label=com.docker.compose.project.working_dir={{ vpn_deploy_dir }}
        --format '{{ "{{" }}.Names{{ "}}" }}'
      register: vpn_ps
      changed_when: false
      check_mode: false

    - name: Check that every container is running
      ansible.builtin.assert:
        that: vpn_containers | difference(vpn_ps.stdout_lines) | length == 0
        fail_msg: >-
          Not running: {{ vpn_containers | difference(vpn_ps.stdout_lines) | join(', ') }}.
          Run make up in {{ vpn_deploy_dir }} to see the error.

    # curl, not uri: uri has no SOCKS5 proxy support
    - name: Wait for a public IP through the balancer  # noqa: command-instead-of-module
      ansible.builtin.command: curl -s -m 15 --socks5-hostname 127.0.0.1:{{ lb_socks_port }} https://ipinfo.io/ip
      register: vpn_ip
      until: vpn_ip.rc == 0 and vpn_ip.stdout | length > 0
      retries: 12
      delay: 10
      changed_when: false
      check_mode: false  # read-only; in --check it verifies the stack that is running now

    - name: Show the VPN IP
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: socks5://{{ bind }}:{{ lb_socks_port }} -> {{ vpn_ip.stdout }}"

    - name: Verify monitoring
      when: vpn_monitoring | bool and not ansible_check_mode
      block:
        - name: Wait until Prometheus scrapes every target
          ansible.builtin.uri:
            url: http://127.0.0.1:{{ prometheus_port }}/api/v1/targets?state=active
            return_content: true
          register: vpn_targets
          until: >-
            vpn_targets.json is defined and vpn_targets.json.data.activeTargets | length > 0
            and vpn_targets.json.data.activeTargets | rejectattr('health', 'eq', 'up') | list | length == 0
          retries: 12
          delay: 5

        - name: Wait until Grafana is ready
          ansible.builtin.uri:
            url: http://127.0.0.1:{{ grafana_port }}/api/health
          register: vpn_grafana
          until: vpn_grafana.status == 200
          retries: 12
          delay: 5

        - name: Show monitoring URLs
          ansible.builtin.debug:
            msg: >-
              Grafana http://{{ monitoring_bind }}:{{ grafana_port }} (admin),
              Prometheus http://{{ monitoring_bind }}:{{ prometheus_port }},
              Alertmanager http://{{ monitoring_bind }}:{{ alertmanager_port }}
              ({{ vpn_telegram | ternary('alerts go to Telegram', 'alerts in the UI only') }})

  handlers:
    # Only when the stack was already running - a fresh start above already picked up the new files
    - name: Restart stack
      ansible.builtin.command: make restart
      args:
        chdir: "{{ vpn_deploy_dir }}"
      when: vpn_running.stdout != ''
      register: vpn_restarted
      changed_when: true

    # A dashboard or alert-rule change must not reconnect the tunnels. Skipped when the whole stack
    # was (re)started in this run - the containers already read the new files.
    - name: Restart monitoring
      ansible.builtin.command: podman restart vpn-prometheus vpn-alertmanager vpn-grafana
      when: vpn_running.stdout != '' and vpn_restarted is not defined
      changed_when: true
