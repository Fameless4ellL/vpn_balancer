groups:
  - name: vpn-recording
    rules:
      - record: vpn:tunnel_usable
        expr: max by (server) (haproxy_server_status{proxy="socks5_pool", state=~"UP|DRAIN|NOLB"})
      - record: vpn:tunnel_active
        expr: >-
          max by (server) (
            (haproxy_server_weight{proxy="socks5_pool"} > bool 0)
            * on (instance, job, proxy, server) haproxy_server_status{proxy="socks5_pool", state="UP"}
          )
      - record: vpn:tunnel_maint
        expr: max by (server) (haproxy_server_status{proxy="socks5_pool", state="MAINT"})
      # 3 = active, 2 = standby, 1 = reconnecting, 0 = down
      - record: vpn:tunnel_state
        expr: 2 * vpn:tunnel_usable + vpn:tunnel_active + vpn:tunnel_maint

  - name: vpn-alerts
    rules:
      - alert: VPNNoActiveTunnel
        expr: sum(vpn:tunnel_active) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: No tunnel is carrying traffic
          description: Neither vpn1 nor vpn2 is active in HAProxy - the proxy is down for every client.

      - alert: VPNRedundancyLost
        expr: vpn:tunnel_usable == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.server }} has been unusable for 5 minutes"
          description: >-
            Only one tunnel is left: the next failure takes the proxy down.
            A normal reconnect takes well under a minute. Check: podman logs {{ $labels.server }} | grep watchdog

      # A planned handover happens about once per ROTATE_PERIOD / 2 (~50 min): more than 4 role changes
      # in 30 min means tunnels keep failing.
      - alert: VPNRoleFlapping
        expr: sum(changes(vpn:tunnel_active[30m])) / 2 > 4
        labels:
          severity: warning
        annotations:
          summary: "Active tunnel changed {{ $value | printf \"%.0f\" }} times in 30 minutes"
          description: Tunnels keep failing or reconnecting - the public IP changes often. Check the watchdog logs.

      - alert: VPNHealthCheckSlow
        expr: avg_over_time(haproxy_server_check_duration_seconds{proxy="socks5_pool"}[10m]) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Health checks through {{ $labels.server }} take {{ $value | printf \"%.1f\" }} s"
          description: The request through the tunnel is close to the 6 s check timeout - the tunnel is slow or lossy.

      - alert: HAProxyMetricsDown
        expr: up{job="haproxy"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Prometheus cannot scrape HAProxy
          description: vpn-lb is down or its metrics endpoint (:8405) does not answer - tunnel alerts cannot fire.

  # The tunnels pick servers from the PIA client's data.json (gen-conf.sh). If it goes stale, they keep
  # reconnecting to servers PIA has already moved or retired, with nothing in the logs.
  - name: pia-alerts
    rules:
      # The daemon rewrites data.json every 10 min while it runs; an hour without a write = it is stopped
      - alert: PIAServerListStale
        expr: time() - pia_data_json_mtime_seconds > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PIA server list is {{ $value | humanizeDuration }} old"
          description: >-
            The PIA client has not updated /opt/piavpn/etc/data.json - its daemon is probably stopped.
            Tunnels reconnect from an outdated server list. Check: systemctl status piavpn; piactl get connectionstate

      - alert: PIAServerListUnreadable
        expr: pia_data_json_readable == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PIA server list (data.json) cannot be read
          description: >-
            /opt/piavpn/etc/data.json is missing or unreadable - tunnels fall back to the servers.txt snapshot
            from the last make up. Is the PIA client installed and its daemon running?

      - alert: PIARegionNoServers
        expr: pia_region_servers == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No PIA servers for region {{ $labels.region }} in data.json"
          description: >-
            The region is offline, renamed, has no OpenVPN UDP servers, or PIA changed the data.json format.
            Tunnels fall back to servers.txt. Check: make regions

      - alert: PIAExporterDown
        expr: up{job="pia"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Prometheus cannot scrape pia-exporter
          description: vpn-pia-exporter is down - the PIA server-list alerts cannot fire.
