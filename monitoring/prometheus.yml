global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: haproxy
    scrape_interval: 5s
    static_configs:
      - targets: [haproxy:8405]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: haproxy_server_(status|weight|current_sessions|sessions_total|bytes_in_total|bytes_out_total|check_duration_seconds|check_failures_total|downtime_seconds_total)|haproxy_backend_(current_sessions|sessions_total)|haproxy_process_start_time_seconds
        action: keep

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
