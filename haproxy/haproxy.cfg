global
    log stdout format raw local0 info
    # Runtime API (inside the container only): echo "show servers state" | nc 127.0.0.1 9990
    stats socket ipv4@127.0.0.1:9990 level admin
    # Don't wait for 1 h client timeouts when the container is stopped/restarted
    hard-stop-after 3s

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout check   6s
    # Health check: a real HTTP request THROUGH the tunnel (gost :8888) - verifies the whole chain
    option httpchk
    http-check send meth GET uri http://www.gstatic.com/generate_204 ver HTTP/1.1 hdr Host www.gstatic.com
    http-check expect status 204
    # Agent check: each tunnel's watchdog answers on :9999 - "ready up 100%" (active tunnel),
    # "ready up 0%" (standby) or "maint" (reconnecting). The watchdogs agree on which tunnel is active,
    # so all traffic goes through one tunnel, moves within ~1 s when it fails or is about to reconnect,
    # and does not jump back afterwards (the public IP changes only when it has to).
    default-server check port 8888 inter 4s fall 2 rise 2 agent-check agent-port 9999 agent-inter 1s resolvers podman init-addr last,libc,none

resolvers podman
    parse-resolv-conf
    hold valid 5s

frontend socks5
    bind :1080
    default_backend socks5_pool

frontend http
    bind :8888
    default_backend http_pool

backend socks5_pool
    server vpn1 vpn1:1080
    server vpn2 vpn2:1080

backend http_pool
    server vpn1 vpn1:8888
    server vpn2 vpn2:8888

frontend stats
    mode http
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
