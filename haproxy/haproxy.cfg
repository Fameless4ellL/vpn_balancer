global
    log stdout format raw local0 info

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout check   6s
    # Health check: a real HTTP request THROUGH the tunnel (gost :8888) - verifies the whole chain
    option httpchk
    http-check send meth GET uri http://www.gstatic.com/generate_204 ver HTTP/1.1 hdr Host www.gstatic.com
    http-check expect status 204
    default-server check port 8888 inter 4s fall 2 rise 2 resolvers podman init-addr last,libc,none
    # Primary + backup: all traffic goes through vpn1; vpn2 (backup) is used only while vpn1 is DOWN,
    # and traffic returns to vpn1 automatically once it recovers

resolvers podman
    parse-resolv-conf
    hold valid 5s

frontend socks5
    bind :1080
    default_backend socks5_pool

frontend http
    bind :8888
    default_backend http_pool

backend socks5_pool
    server vpn1 vpn1:1080
    server vpn2 vpn2:1080 backup

backend http_pool
    server vpn1 vpn1:8888
    server vpn2 vpn2:8888 backup

frontend stats
    mode http
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
